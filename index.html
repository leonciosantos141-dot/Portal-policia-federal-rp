

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polícia Federal RP - Portal Oficial</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .navbar-pf { background-color: #1c2541; border-bottom: 3px solid #d4af37; }
        .card-pf { background-color: #1c2541; border: 1px solid #3a506b; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pf">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="#">Federal RP</a>
        </div>
    </nav>
    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold">DEPARTAMENTO DE POLÍCIA FEDERAL</h1>
            <p class="lead text-muted">Sistema de Intranet — Cidade FiveM</p>
        </div>
        <div class="row g-4 justify-content-center">
            <div class="col-md-6">
                <div class="card card-pf text-white p-4 shadow">
                    <h3 class="card-title mb-4 text-center">Acesso ao Sistema</h3>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Número do Passaporte</label>
                            <input type="number" class="form-control bg-dark text-white border-secondary" placeholder="Ex: 1042">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha de Agente</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary" placeholder="******">
                        </div>
                        <button type="button" class="btn btn-warning w-100 fw-bold">Entrar no Terminal</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
